# Sin esto, `pytest` desde la raiz recogia los scripts sueltos de backend/ (uno
# de ellos llamaba a sys.exit(1) al importarse) y la ejecucion moria con
# INTERNALERROR antes de correr un solo test.
[pytest]
testpaths = backend/tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
